project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - images/

website:
  title: "Pianode Music"
  site-url: "https://pianodemusic.com"
  description: "Piano by ear, a keen musical ear, and soulful piano worship medleys."
  favicon: images/favicon.svg
  open-graph: true
  navbar:
    logo: images/logo.svg
    logo-alt: "Pianode Music"
    title: "Pianode Music"
    right:
      - text: "Watch"
        href: watch.qmd
      - text: "Lessons"
        href: lessons.qmd
      - text: "About"
        href: about.qmd
      - text: "Contact"
        href: contact.qmd
      - icon: youtube
        href: https://www.youtube.com/@nimopianode
        aria-label: "YouTube"
  page-footer:
    left: "© 2026 Pianode Music"
    center: "Learn to play by ear · Worship medleys"
    right:
      - icon: youtube
        href: https://www.youtube.com/@nimopianode
        aria-label: "YouTube"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: false
    page-layout: full
    title-block-style: none
    smooth-scroll: true
